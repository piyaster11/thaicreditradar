name: Credit Fear & Greed (daily)
on:
  schedule: [{ cron: "7 0 * * *" }]   # ~07:07 Bangkok
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/credit_fg.py
      - run: python3 scripts/credit_news.py
        continue-on-error: true
      - run: python3 scripts/credit_fg_backtest.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/credit_fg.json data/credit_fg.js data/credit_fg_history.json data/credit_fg_history.js data/credit_news.json data/credit_news.js && git commit -m "Refresh Credit Fear & Greed" && (git pull --rebase && git push) || echo "nothing new"
